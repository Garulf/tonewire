[package]
name = "tonewired"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["tray"]
tray = ["dep:ksni", "dep:tray-icon"]
pipewire = ["tonewire-io/pipewire"]

[dependencies]
tonewire-graph.workspace = true
tonewire-proto.workspace = true
tonewire-io.workspace = true
tonewire-nvafx.workspace = true
interprocess.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
directories.workspace = true
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"], optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"
windows-result = "0.4"
